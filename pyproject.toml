[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-youtube-shorts-generator"
dynamic = ["version"]
description = "Turn long videos into ranked, vertical shorts with local or hosted AI"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Everything --mode local and --critique need. Keep in sync with requirements-local.txt
# (tests/test_packaging.py checks this).
local = [
    "yt-dlp>=2024.1.1",
    "faster-whisper>=1.0.0",
    "av>=14,<16",
    "openai>=1.0.0",
    "opencv-python>=4.8,<5",
]
dev = [
    "pytest>=8",
]

[project.scripts]
shorts = "shorts_generator.cli:main"

[tool.setuptools.packages.find]
include = ["shorts_generator*"]

[tool.setuptools.package-data]
shorts_generator = ["data/*"]

[tool.setuptools.dynamic]
version = { attr = "shorts_generator.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "ffmpeg: needs ffmpeg and ffprobe on PATH",
]
